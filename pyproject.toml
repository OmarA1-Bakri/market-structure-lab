[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-structure-lab"
version = "0.1.0"
description = "Research platform for cryptocurrency market structure analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb",
    "polars",
    "sqlalchemy",
    "psycopg[binary]",
    "plotly",
    "jupyterlab",
    "ipywidgets",
    "python-dotenv",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
