[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-structure-lab"
version = "0.1.0"
description = "Research platform for cryptocurrency market structure analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "numpy",
    "polars",
    "scipy",
    "numba",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "scikit-learn",
    "xgboost",
    "hmmlearn",
    "networkx",
    "plotly",
    "matplotlib",
    "jupyterlab",
    "ipywidgets",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "typer",
    "tqdm",
    "rich",
    "orjson",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
