[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-structure-lab"
version = "0.1.0"
description = "Research platform for cryptocurrency market structure analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb",
    "polars",
    "scipy",
    "sqlalchemy",
    "psycopg[binary]",
    "plotly",
    "jupyterlab",
    "ipywidgets",
    "python-dotenv",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy<2",
]

[project.scripts]
msl-backfill-candles = "market_structure_lab.cli.backfill_candles:main"
msl-db-inspect = "market_structure_lab.cli.inspect_database:main"
msl-reconcile-candles = "market_structure_lab.cli.reconcile_candles:main"
msl-run-discovery-program = "market_structure_lab.cli.run_discovery_program:main"
msl-sync-candles = "market_structure_lab.cli.sync_candles:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_structure_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
