services:
  postgres:
    image: postgres:17
    container_name: market-structure-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/dumps/callscore.dump:/docker-entrypoint-initdb.d/callscore.dump:ro
      - ./docker/postgres/init/restore_dump.sh:/docker-entrypoint-initdb.d/10_restore_dump.sh:ro
      - ./docker/postgres/init/crypto_only_restore.list:/usr/local/share/market-structure-lab/crypto_only_restore.list:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: market-structure-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
    ports:
      - "5050:80"
    depends_on:
      - postgres
